# OAMS platform — VPS deployment stack (PostgreSQL + Next.js app)
# Usage: docker compose up -d --build   (on the VPS)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Expose on host so the local dev server (.env DATABASE_URL) can reach it.
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: oams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oams}
      POSTGRES_DB: oams
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oams -d oams"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://oams:${POSTGRES_PASSWORD:-oams}@db:5432/oams?schema=public
      DIRECT_URL: postgresql://oams:${POSTGRES_PASSWORD:-oams}@db:5432/oams?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-OAMS <no-reply@oams.shop>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@oams.shop}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SESSION_COOKIE: ${SESSION_COOKIE:-oams_session}
      # Google "Sign in with Google" OAuth (client id + secret from .env)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads: